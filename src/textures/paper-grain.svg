<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Pre-rendered paper grain. Rasterised once by the browser as a tiled
       background-image, never re-filtered per frame. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" seed="11"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.55" intercept="0"/>
    </feComponentTransfer>
  </filter>
  <rect width="420" height="420" filter="url(#grain)"/>
</svg>
