<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Coarser blotching: the unevenness of cheap cream stock. -->
  <filter id="fibre" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="3" stitchTiles="stitch" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.3"/>
    </feComponentTransfer>
  </filter>
  <rect width="600" height="600" filter="url(#fibre)"/>
</svg>
